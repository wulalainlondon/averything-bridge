name: canonical-entry-verification
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check compatibility entry syntax
        run: bash -n install.sh
# Support tags never build a second backend, read signing credentials or publish.
# The authorized controller publishes only identical canonical frozen artifacts.
