<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Averything 推播配對</title>
<style nonce="{{.CSRF}}">
:root{color-scheme:light dark;font:16px system-ui,sans-serif}body{max-width:560px;margin:64px auto;padding:0 24px;line-height:1.65}h1{font-size:26px}label{display:block;margin-top:20px}select,input,button{font:inherit;padding:10px;border-radius:8px;max-width:100%;box-sizing:border-box}select{width:100%}button{cursor:pointer;margin-top:16px}input{width:170px;letter-spacing:3px}#status{white-space:pre-wrap;min-height:48px}button:disabled{opacity:.55;cursor:wait}.quiet{opacity:.75;font-size:14px}
</style>
<h1>Averything 推播配對</h1>
<p>先在手機 App 連接這台 Bridge 並允許通知，再選擇手機。傳送驗證碼前，請將手機 App 切到背景，再查看通知。你不需要設定 Firebase 或下載金鑰。</p>
<label for="device">已配對的手機</label><select id="device" aria-label="已配對的手機"></select>
<button id="verify">傳送驗證推播</button>
<section id="codeSection" hidden><label for="code">手機通知中的六位驗證碼</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><br><button id="confirm">完成配對</button></section>
<p id="status" role="status" aria-live="polite"></p>
<p class="quiet">驗證碼五分鐘內有效。核准後，這台 Bridge 只能透過服務通知已驗證的手機。聊天仍直接連接你的 Bridge；推播服務會經手通知內容。沒有通知時，請檢查系統通知設定，再稍後重試。</p>
<script nonce="{{.CSRF}}">
'use strict';
const csrf={{.CSRF}};
const device=document.getElementById('device'),status=document.getElementById('status'),verify=document.getElementById('verify'),confirm=document.getElementById('confirm'),code=document.getElementById('code'),section=document.getElementById('codeSection');
let challenge='';
const messages={relay_unavailable:'推播服務暫時無法連線，請稍後重試。',verification_not_sent:'未能傳送驗證通知；請確認手機允許通知，並稍後重試。',verification_failed:'驗證碼不正確或已失效，請確認手機通知。',verification_expired:'驗證碼已失效，或手機已解除配對。',device_not_paired:'這支手機尚未與 Bridge 配對。'};
async function api(value){const response=await fetch('/push/setup/api',{method:'POST',headers:{'Content-Type':'application/json','X-Push-Setup-CSRF':csrf},body:JSON.stringify(value)});const result=await response.json();if(!response.ok)throw new Error(messages[result.error]||'設定未完成，請稍後重試。');return result;}
async function refresh(){const devices=await api({action:'list'});device.replaceChildren();for(const item of devices){const option=document.createElement('option');option.value=item.device_id;option.textContent=(item.platform==='ios'?'iPhone / iPad':item.platform==='android'?'Android':'手機 / 平板')+' · '+item.device_id+(item.approved?'（推播已啟用）':'（待驗證）');device.append(option);}verify.disabled=!devices.length;if(!devices.length)status.textContent='尚未收到已配對手機的推播註冊。請開啟手機 App，連接這台 Bridge 後重新整理。';}
verify.addEventListener('click',async()=>{verify.disabled=true;status.textContent='正在傳送驗證通知…';try{const result=await api({action:'challenge',device_id:device.value});challenge=result.challenge_id;section.hidden=false;code.value='';code.focus();status.textContent='請查看手機通知，輸入六位驗證碼。';}catch(error){status.textContent=error.message;}finally{verify.disabled=false;}});
confirm.addEventListener('click',async()=>{if(!/^\d{6}$/.test(code.value)){status.textContent='請輸入六位數字。';return;}confirm.disabled=true;try{await api({action:'confirm',challenge_id:challenge,code:code.value});challenge='';section.hidden=true;code.value='';await refresh();status.textContent='推播已啟用。之後任務通知會自動送到這支手機。';}catch(error){status.textContent=error.message;}finally{confirm.disabled=false;}});
refresh().catch(error=>{verify.disabled=true;status.textContent=error.message;});
</script>
</html>
